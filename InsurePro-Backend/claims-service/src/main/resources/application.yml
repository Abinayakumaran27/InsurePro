server:
  port: 8084

spring:
  application:
    name: claims-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    openfeign:
      autoconfiguration:
        jackson:
          enabled: false   # Prevents Feign's SortJsonComponent from being registered globally,
                           # which breaks Jackson serialization of PageImpl in REST responses.
  datasource:
    url: jdbc:mysql://localhost:3306/insurepro_claims?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: Priya@2004
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ClaimsHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eurekaadmin}:${EUREKA_PASSWORD:Eureka@2024}@localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: ${ZIPKIN_PROBABILITY:0.1}
  zipkin:
    tracing:
      export:
        enabled: ${ZIPKIN_ENABLED:true}

jwt:
  secret: ${JWT_SECRET:InsureProSecureJWTSecretKeyForHS256Algorithm}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      policy-service:
        baseConfig: default
      customer-service:
        baseConfig: default
  retry:
    instances:
      policy-service:
        maxAttempts: 3
        waitDuration: 500ms
      customer-service:
        maxAttempts: 3
        waitDuration: 500ms
  timelimiter:
    instances:
      policy-service:
        timeoutDuration: 5s
      customer-service:
        timeoutDuration: 5s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    '[com.insurepro]': DEBUG
    '[org.springframework.security]': WARN
  file:
    name: logs/claims-service.log

