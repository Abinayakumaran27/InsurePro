global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'iam-service'
    metrics_path: '/actuator/prometheus'
    static_configs: [{targets: ['iam-service:8081']}]
  - job_name: 'customer-service'
    metrics_path: '/actuator/prometheus'
    static_configs: [{targets: ['customer-service:8082']}]
  - job_name: 'policy-service'
    metrics_path: '/actuator/prometheus'
    static_configs: [{targets: ['policy-service:8083']}]
  - job_name: 'claims-service'
    metrics_path: '/actuator/prometheus'
    static_configs: [{targets: ['claims-service:8084']}]
  - job_name: 'premium-payment-service'
    metrics_path: '/actuator/prometheus'
    static_configs: [{targets: ['premium-payment-service:8085']}]
  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs: [{targets: ['notification-service:8086']}]
  - job_name: 'audit-compliance-service'
    metrics_path: '/actuator/prometheus'
    static_configs: [{targets: ['audit-compliance-service:8087']}]
  - job_name: 'analytics-service'
    metrics_path: '/actuator/prometheus'
    static_configs: [{targets: ['analytics-service:8088']}]
  - job_name: 'underwriting-service'
    metrics_path: '/actuator/prometheus'
    static_configs: [{targets: ['underwriting-service:8089']}]
  - job_name: 'document-service'
    metrics_path: '/actuator/prometheus'
    static_configs: [{targets: ['document-service:8090']}]
